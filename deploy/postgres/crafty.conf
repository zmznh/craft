# Crafty PostgreSQL tuning for a 964 MiB box.
#
# Install to:  /etc/postgresql/13/main/conf.d/crafty.conf
# Debian's postgresql.conf ends with `include_dir 'conf.d'`, so this file is
# picked up on restart and does not fight package upgrades.
#
# Goal: keep PostgreSQL around 110-150 MB RSS so Next.js + Hocuspocus +
# tldraw-sync + Caddy still fit. Defaults (shared_buffers=128MB) alone would
# eat a sixth of the machine before a single query runs.

# --- memory ---
shared_buffers = 32MB
effective_cache_size = 128MB
work_mem = 2MB                  # per sort/hash, per query — not per connection
maintenance_work_mem = 32MB     # VACUUM / CREATE INDEX only
temp_buffers = 1MB
wal_buffers = 1MB

# --- connections ---
# Three Node processes each hold a pg Pool (pg defaults to max 10). 30 keeps
# the worst case under the ceiling; idle backends are cheap, active ones are
# not. If you later find a per-process pool-size knob, set it to 5-8 and drop
# this back to 20.
max_connections = 30

# --- checkpoints / WAL ---
# Yjs checkpoints write every 1-5s per open document, so WAL churn is steady
# rather than bursty. Spreading checkpoints avoids I/O stalls on a 1-core box.
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 64MB

# --- planner ---
# Set to 4 if this VM is on spinning disks; 1.1 assumes SSD/NVMe-backed KVM.
random_page_cost = 1.1
effective_io_concurrency = 2

# --- autovacuum ---
# One worker is enough and avoids competing with the app for the single core.
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 60s
track_counts = on

# --- logging ---
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off
log_lock_waits = on
